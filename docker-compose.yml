services:
  dredging:
    build: .
    image: dredging-acceptance:1.0.0
    container_name: dredging-acceptance
    ports:
      - "8000:8000"
    environment:
      # 每个统计块的边长 (格), 块 = BLOCK_SIZE x BLOCK_SIZE 个 1 米方格
      BLOCK_SIZE: "16"
      BUSY_TIMEOUT_S: "10"
      DB_PATH: "/data/dredging.db"
    volumes:
      - dredging-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  dredging-data:
